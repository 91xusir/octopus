name: release

on:
  push:
    branches:
      - master
    paths:
      - main.go

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish tag
        id: version
        run: |
          VERSION=$(grep '^// Version ' main.go | sed 's|^// Version ||' | tr -d ' ')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update price
        run: python3 scripts/updatePrice.py

      - name: Build
        run: bash scripts/build.sh

      - name: Generate changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/archives/*
          prerelease: false
          tag_name: ${{ steps.version.outputs.version }}
